# One command: docker compose up --build
# SQLite-free default: PostgreSQL + pgvector.  Neo4j is optional (profile "graph").
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ariadne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ariadne}
      POSTGRES_DB: ${POSTGRES_DB:-ariadne}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ariadne}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ariadne}:${POSTGRES_PASSWORD:-ariadne}@postgres:5432/${POSTGRES_DB:-ariadne}
      VECTOR_STORE: pgvector
      MCP_SERVER_URL: http://mcp:8765/mcp
      MCP_API_BASE_URL: http://api:8000
      DEMO_MODE: ${DEMO_MODE:-1}
    ports: ["8000:8000"]
    volumes:
      - ./data:/srv/ariadne/data
    depends_on:
      postgres: { condition: service_healthy }

  mcp:
    build: { context: ., dockerfile: apps/mcp-server/Dockerfile }
    environment:
      MCP_SERVER_PORT: "8765"
      MCP_API_BASE_URL: http://api:8000
    ports: ["8765:8765"]
    depends_on: [api]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["4173:4173"]
    depends_on: [api]

  neo4j:
    image: neo4j:5
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/ariadne
    ports: ["7474:7474", "7687:7687"]

volumes:
  pgdata:
